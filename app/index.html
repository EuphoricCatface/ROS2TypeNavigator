<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>rosdoc2 topic type browser</title>
        <link href="style.css" rel="stylesheet" type="text/css">
        <script src="app.js"></script>
    </head>
    <body>
        <div id="banner">
            <label for="distro-select">ROS2 Distro:</label>
            <input list="distros" id="distro-select" />
            <datalist id="distros">
                <option>galactic</option>
                <option>humble</option>
                <option>iron</option>
                <option>jazzy</option>
                <option>kilted</option>
                <option>lyrical</option>
                <option>rolling</option>
            </datalist>
            <label for="pkg">Package</label>
            <input id="pkg" />
            <label for="type">Type:</label>
            <select id="type">
                <option>msg</option>
            </select>
            <label for="name">Name</label>
            <input id="name" />
            <button id="go">Go</button>
        </div>
        <div id="raw-msg">
        </div>
        <div id="fancy-msg">
        </div>
    </body>
</html>
