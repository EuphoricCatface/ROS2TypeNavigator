<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ROS2 Type Navigator</title>
    <link rel="stylesheet" href="popup.css">
    <script src="core.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <p class="eyebrow">ROS 2 DOCUMENTATION</p>
      <h1>Type Navigator</h1>
      <p class="intro">Jump to a package or interface.</p>
    </header>
    <form id="navigator" novalidate>
      <fieldset id="fields" disabled>
        <legend class="visually-hidden">Documentation destination</legend>
        <label for="distro">Distro</label>
        <input id="distro" name="distro" list="distros" placeholder="ex: rolling" autocomplete="off" spellcheck="false">
        <datalist id="distros">
          <option value="rolling"></option>
          <option value="lyrical"></option>
          <option value="kilted"></option>
          <option value="jazzy"></option>
          <option value="iron"></option>
          <option value="humble"></option>
          <option value="galactic"></option>
        </datalist>
        <label for="pkg">Package</label>
        <input id="pkg" name="pkg" placeholder="ex: visualization_msgs" autocomplete="off" spellcheck="false" aria-describedby="navigation-hint">
        <div class="interface-row">
          <div>
            <label for="type">Type</label>
            <select id="type" name="type">
              <option value="msg">Message (msg)</option>
              <option value="srv">Service (srv)</option>
            </select>
          </div>
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" placeholder="ex: Marker" autocomplete="off" spellcheck="false" aria-describedby="navigation-hint">
          </div>
        </div>
        <p id="navigation-hint" class="hint">Leave Name empty to browse a package.<br>Leave Package empty to browse a distro.</p>
        <p id="error" role="alert" hidden></p>
        <button id="go" type="submit" aria-describedby="go-hint">Go <span aria-hidden="true">→</span></button>
      </fieldset>
    </form>
    <footer id="go-hint">Left click or Enter: current tab.<br>Middle click: new tab.</footer>
  </body>
</html>
